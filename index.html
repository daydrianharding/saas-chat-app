<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Avatar Archive | Outfit Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --roblox-red: #d01012;
            --roblox-dark: #111;
            --roblox-gray: #1a1a1a;
            --accent: #00a2ff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Animated background grid */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 162, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 162, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            padding: 3rem 0;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }

        /* Search Section */
        .search-container {
            max-width: 600px;
            margin: 2rem auto 4rem;
            position: relative;
        }

        .search-box {
            display: flex;
            gap: 1rem;
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 0.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0, 162, 255, 0.2);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 1rem 1.5rem;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
        }

        input::placeholder {
            color: #666;
        }

        button {
            background: linear-gradient(135deg, var(--accent) 0%, #0080cc 100%);
            border: none;
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 162, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* User Profile Card */
        .profile-card {
            display: none;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            margin-bottom: 3rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 20px;
            height: 20px;
            background: #00ff88;
            border-radius: 50%;
            border: 3px solid #1a1a1a;
        }

        .profile-info h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .verified {
            color: var(--accent);
            font-size: 1.2rem;
        }

        .stats {
            display: flex;
            gap: 2rem;
            color: #888;
            font-size: 0.95rem;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            color: #fff;
            font-weight: 700;
            font-size: 1.2rem;
        }

        /* Avatars Grid */
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--accent);
            border-radius: 2px;
        }

        .avatars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .avatar-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .avatar-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 162, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .avatar-preview {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            position: relative;
            overflow: hidden;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .avatar-card:hover .avatar-preview img {
            transform: scale(1.05);
        }

        .avatar-info {
            padding: 1rem;
        }

        .avatar-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .avatar-date {
            font-size: 0.85rem;
            color: #666;
        }

        .wear-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 162, 255, 0.9);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }

        .avatar-card:hover .wear-btn {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .error-message {
            display: none;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6666;
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
            margin-top: 1rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .profile-header { justify-content: center; text-align: center; }
            .avatars-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <div class="container">
        <header>
            <h1>Roblox Avatar Archive</h1>
            <p class="subtitle">View and manage saved character outfits</p>
        </header>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="usernameInput" placeholder="Enter Roblox username..." autocomplete="off">
                <button onclick="searchUser()" id="searchBtn">Search</button>
            </div>
            <div class="error-message" id="errorMsg"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Fetching avatars...</p>
        </div>

        <div class="profile-card" id="profileCard">
            <div class="profile-header">
                <div class="avatar-container">
                    <img id="currentAvatar" src="" alt="Current Avatar">
                    <div class="status-badge"></div>
                </div>
                <div class="profile-info">
                    <h2 id="displayName">User <span class="verified">✓</span></h2>
                    <p style="color: #888; margin-bottom: 1rem;">@<span id="username">username</span></p>
                    <div class="stats">
                        <div class="stat">
                            <span class="stat-value" id="outfitCount">0</span>
                            <span>Saved Outfits</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value" id="lastUpdated">Now</span>
                            <span>Last Updated</span>
                        </div>
                    </div>
                </div>
            </div>

            <h3 class="section-title">Saved Outfits</h3>
            <div class="avatars-grid" id="avatarsGrid">
                <!-- Avatars will be populated here -->
            </div>
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">👤</div>
            <h3>No saved avatars found</h3>
            <p>This user hasn't saved any outfits yet.</p>
        </div>
    </div>

    <div class="toast" id="toast">Copied outfit link to clipboard!</div>

    <script>
        // Mock database of avatars for demo purposes
        // In production, this would come from your backend proxy
        const mockAvatars = [
            { id: 1, name: "Classic Noob", date: "2024-01-15", url: "https://tr.rbxcdn.com/30DAY-Avatar-1-Png/352/352/Avatar/Png/noFilter" },
            { id: 2, name: "Space Explorer", date: "2024-02-20", url: "https://tr.rbxcdn.com/30DAY-Avatar-2-Png/352/352/Avatar/Png/noFilter" },
            { id: 3, name: "Ninja Assassin", date: "2024-03-10", url: "https://tr.rbxcdn.com/30DAY-Avatar-3-Png/352/352/Avatar/Png/noFilter" },
            { id: 4, name: "Summer Vibes", date: "2024-04-05", url: "https://tr.rbxcdn.com/30DAY-Avatar-4-Png/352/352/Avatar/Png/noFilter" },
            { id: 5, name: "Cyber Punk", date: "2024-05-12", url: "https://tr.rbxcdn.com/30DAY-Avatar-5-Png/352/352/Avatar/Png/noFilter" },
            { id: 6, name: "Medieval Knight", date: "2024-06-18", url: "https://tr.rbxcdn.com/30DAY-Avatar-6-Png/352/352/Avatar/Png/noFilter" }
        ];

        async function searchUser() {
            const username = document.getElementById('usernameInput').value.trim();
            const btn = document.getElementById('searchBtn');
            const loading = document.getElementById('loading');
            const profileCard = document.getElementById('profileCard');
            const errorMsg = document.getElementById('errorMsg');
            
            if (!username) {
                showError('Please enter a username');
                return;
            }

            // Reset UI
            errorMsg.style.display = 'none';
            profileCard.style.display = 'none';
            btn.disabled = true;
            loading.style.display = 'block';

            try {
                // Simulate API delay
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // In production, this would be:
                // const response = await fetch(`/api/user/${username}/outfits`);
                // const data = await response.json();
                
                // Mock successful response
                const userData = {
                    username: username,
                    displayName: username.charAt(0).toUpperCase() + username.slice(1),
                    userId: Math.floor(Math.random() * 1000000000),
                    avatarUrl: `https://tr.rbxcdn.com/30DAY-AvatarHeadshot-AE927F1275B54C9B8FC3D72C716E5E66-Png/150/150/AvatarHeadshot/Png/noFilter`,
                    outfits: mockAvatars.sort(() => Math.random() - 0.5).slice(0, Math.floor(Math.random() * 4) + 2)
                };

                displayUserData(userData);
                
            } catch (error) {
                showError('User not found or API rate limited');
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function displayUserData(data) {
            document.getElementById('displayName').innerHTML = `${data.displayName} <span class="verified">✓</span>`;
            document.getElementById('username').textContent = data.username;
            document.getElementById('currentAvatar').src = data.avatarUrl;
            document.getElementById('outfitCount').textContent = data.outfits.length;
            
            const grid = document.getElementById('avatarsGrid');
            grid.innerHTML = '';
            
            if (data.outfits.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
            } else {
                document.getElementById('emptyState').style.display = 'none';
                
                data.outfits.forEach((outfit, index) => {
                    const card = document.createElement('div');
                    card.className = 'avatar-card';
                    card.style.animation = `slideUp 0.5s ease ${index * 0.1}s both`;
                    
                    card.innerHTML = `
                        <div class="avatar-preview">
                            <img src="${outfit.url}" alt="${outfit.name}" onerror="this.src='https://tr.rbxcdn.com/30DAY-Avatar-1-Png/352/352/Avatar/Png/noFilter'">
                            <button class="wear-btn" onclick="copyOutfit('${outfit.id}')">Copy Outfit</button>
                        </div>
                        <div class="avatar-info">
                            <div class="avatar-name">${outfit.name}</div>
                            <div class="avatar-date">Saved on ${outfit.date}</div>
                        </div>
                    `;
                    
                    grid.appendChild(card);
                });
            }
            
            document.getElementById('profileCard').style.display = 'block';
        }

        function copyOutfit(id) {
            // In production, this would copy the outfit ID or deep link
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        function showError(msg) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        // Allow Enter key to search
        document.getElementById('usernameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchUser();
        });

        // Demo: Load a sample user on first load
        window.addEventListener('load', () => {
            document.getElementById('usernameInput').value = 'Builderman';
            setTimeout(searchUser, 500);
        });
    </script>
</body>
</html>
